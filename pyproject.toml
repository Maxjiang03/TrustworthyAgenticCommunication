[project]
name = "trustworthy-agent"
version = "0.0.1"
description = "Pre-registered testbed measuring authorization-scope propagation and its cost at the A2A→MCP boundary (cross-protocol confused deputy, TV23)"
authors = [{ name = "Yixian Jiang" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
# numpy, scipy and pyyaml were declared here and imported by NOTHING -- verified
# by an import scan across src/, analysis/, fixtures/, tests/, smoke/ and
# tools/. They were also the sole cause of a split resolution: `uv.lock` is a
# universal resolve, so a 3.11 interpreter and the sealed 3.13 one pinned
# DIFFERENT numpy/scipy versions, which made "the pinned environment" two
# environments. Removed rather than kept for a future need: an unused dependency
# in a sealed environment is a claim the seal cannot support. The one
# pre-registered statistic outside `analysis/` -- the exact Mann-Whitney U over
# 70 labelings -- is stdlib `itertools.combinations`, and `analysis/latency.py`
# implements its bootstrap CI with stdlib `random` + `statistics` (ADR 0044).
dependencies = [
  "pydantic>=2.7",
  "cryptography>=42.0",
  # Exact pin — verified by gate G-1 (ADR 0002); any version bump re-triggers G-1.
  "biscuit-python==0.4.0",
  # Exact pin — verified by gate G-8 (ADR 0005); any version bump re-triggers G-8.
  "rfc8785==0.1.4",
  # Exact pin — verified by gate G-5 (ADR 0006); any version bump re-triggers G-5.
  # Verified for the JOSE/DPoP surface only (JWS Ed25519, OKP JWK, RFC 7638 thumbprint).
  "joserfc==1.7.4",
  # Exact pin — verified by gates G-6/G-7 (ADR 0013); any version bump re-triggers G-6/G-7.
  # Verified for the FastMCP tool-call dispatch + interposition surface only.
  "mcp==1.28.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# PENDING GATE — do not pin until the gate decides:
#   authlib (RFC 8693 + RFC 9396)     -> gate G-4

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
